<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamp Controller</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(255, 236, 236);
        }

        .bg {
            background-color: rgb(0, 151, 238);
            width: 100%;
            min-height: 50vh;
            display: flex;
            justify-content: center;
            align-items: end;
            box-shadow: 1px 29px 125px 90px rgba(0, 151, 238, 1);
            -webkit-box-shadow: 1px 29px 125px 90px rgba(0, 151, 238, 1);
            -moz-box-shadow: 1px 29px 125px 90px rgba(0, 151, 238, 1);
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .on-container {
            margin: 1rem;
            padding: 1rem 0em 1.3rem 0;
            background-color: rgb(3, 202, 252);
            border-radius: 30px;
            border: solid 3px;
            border-top: 0;
            border-color: rgb(240, 248, 255, 1);
        }

        .on {
            font-family: fantasy;
            font-size: 18px;
            font-weight: 500;
            text-decoration: none;
            padding: 1rem 3rem 1rem 3rem;
            color: rgb(0, 26, 255);
            background-color: rgba(255, 255, 255, 0.7);
            text-align: center;
            justify-content: center;
            border-radius: 30px;

        }

        .on:hover,
        .off:hover {
            background-color: rgb(240, 248, 255, .9);
        }

        .off-container {
            margin: 1rem;
            padding: 1rem 0em 1.3rem 0;
            background-color: rgba(252, 34, 34, 0.945);
            border-radius: 30px;
            border: solid 3px;
            border-top: 0;
            border-color: rgb(240, 248, 255, 1);
        }

        .off {
            font-family: fantasy;
            text-decoration: none;
            padding: 1rem 3rem 1rem 3rem;
            color: rgb(255, 0, 0);
            background-color: rgba(255, 255, 255, 0.7);
            text-align: center;
            justify-content: center;
            border-radius: 30px;

        }
    </style>
</head>

<body>

    <div class="bg">
        <div class="container">
            <div class="on-container">
                <a class="on" href="#">ON</a>
            </div>
            <br>
            <div class="off-container">
                <a class="off" href="#">OFF</a>
            </div>
        </div>
    </div>

</body>

</html>
